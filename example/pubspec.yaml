name: geo_map_example
description: Minimal geo_map demo — MBTiles base map, 2D/3D switch, graticule.
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  latlong2: ^0.9.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.0
  geo_map:
    path: ../packages/geo_map

flutter:
  uses-material-design: true
  assets:
    - assets/tiles/
