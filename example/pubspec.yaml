name: geo_map_example
description: geo_map demo gallery — web-runnable demos plus native-only code samples.
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  latlong2: ^0.9.1
  # Native-only demos (MBTiles) need these. The web entry point never imports
  # them, so `flutter build web` simply leaves them out.
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.0
  geo_map:
    path: ../packages/geo_map

flutter:
  uses-material-design: true
  assets:
    - assets/tiles/
    - assets/vector/
    - assets/images/
