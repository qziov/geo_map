name: API docs

# Build `dart doc` for both packages and publish to GitHub Pages.
#
# Requires: repository Settings → Pages → Source = "GitHub Actions".
# This workflow deploys with the official Pages actions (upload-pages-artifact +
# deploy-pages). It does NOT push a `gh-pages` branch, so do not mix it with the
# "Deploy from a branch" source.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter bundles Dart, and `geo_map` is a Flutter package, so one setup
      # covers both `dart doc` runs.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Docs — geo_map_core (pure Dart)
        working-directory: packages/geo_map_core
        run: |
          dart pub get
          dart doc --output ../../doc/api/geo_map_core

      - name: Docs — geo_map (Flutter shell)
        working-directory: packages/geo_map
        run: |
          flutter pub get
          dart doc --output ../../doc/api/geo_map

      - name: Landing page
        run: |
          cat > doc/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>geo_map API docs</title>
            <style>
              body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                     max-width: 640px; margin: 64px auto; padding: 0 16px;
                     line-height: 1.7; color: #222; }
              a { color: #3498db; }
              code { background: #f3f3f3; padding: 1px 5px; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>geo_map API docs</h1>
            <p>Self-contained 2D/3D Flutter map engine.</p>
            <ul>
              <li><a href="api/geo_map/">geo_map</a> — Flutter shell: <code>GeoMap</code> widget, unified render stack, sources</li>
              <li><a href="api/geo_map_core/">geo_map_core</a> — pure-Dart core: projection, camera, selection, tiles</li>
            </ul>
          </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
